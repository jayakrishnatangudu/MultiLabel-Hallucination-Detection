# Phase 2 Synthetic Multi-Label Generation, Pilot & Auditing Configuration
schema_version: "2.0"
random_seed: 42

paths:
  source_splits:
    train: "data/splits/source_train.jsonl"
    val: "data/splits/source_val.jsonl"
    test_synthetic_pool: "data/splits/source_test_synthetic_pool.jsonl"
    test_natural_pool: "data/splits/source_test_natural_pool.jsonl"
  prompts_dir: "prompts/v1_0"
  pilot_output_dir: "data/synthetic/pilot_e0"
  full_output_dir: "data/synthetic/full"
  natural_output_dir: "data/natural"
  reports_dir: "results"

taxonomy:
  labels:
    - "factual_inconsistency"
    - "factual_fabrication"
    - "instruction_inconsistency"
    - "logical_inconsistency"
    - "context_inconsistency"
  sequential_injection_order:
    # Forward: directive shift first, external/context edits on disjoint clauses, internal contradiction last
    - "instruction_inconsistency"
    - "factual_inconsistency"
    - "context_inconsistency"
    - "factual_fabrication"
    - "logical_inconsistency"
  reverse_injection_order:
    - "logical_inconsistency"
    - "factual_fabrication"
    - "context_inconsistency"
    - "factual_inconsistency"
    - "instruction_inconsistency"

source_policies:
  medquad:
    domain: "medical"
    has_context: false
    redistribution_permitted: true
    license: "CC-BY-4.0"
  pubmedqa:
    domain: "medical"
    has_context: true
    redistribution_permitted: true
    license: "MIT"
    pqa_labeled_target_share: 0.20
  legal_qa_v1:
    domain: "legal"
    has_context: false
    redistribution_permitted: false
    license: "unresolved"
    exclude_from_public_release: true
  cuad_qa:
    domain: "legal"
    has_context: true
    redistribution_permitted: true
    license: "CC-BY-4.0 (Zenodo 4595826 / HF)"
    evidence_window:
      enabled_for_prompting_only: true
      preserve_full_context_on_record: true
      max_prompt_context_words: 1800
      preamble_words: 250
      window_words_around_span: 750
  fiqa:
    domain: "finance"
    has_context: false
    redistribution_permitted: false
    license: "upstream_caution (mixed CC BY-SA / forum ToS)"
    exclude_from_public_release: true

backends:
  # Approved generation backend: Google Gemini 3.8 Flash (`gemini-3.8-flash`).
  # Pricing verified via https://ai.google.dev/gemini-api/docs/pricing (paid tier intro rates through Dec 31, 2026).
  # Live execution stays blocked until GEMINI_API_KEY is supplied and live GET /models verification sets model_availability_verified: true.
  synthetic_generator:
    provider: "google_gemini"
    model_family: "gemini"
    model_id: "gemini-3.8-flash"
    api_mode: "gemini_native_rest"
    api_base_env: "GEMINI_API_BASE"
    default_api_base: "https://generativelanguage.googleapis.com/v1beta"
    api_key_env: "GEMINI_API_KEY"
    model_availability_verified: false
    pricing_verified: true
    decoding:
      max_tokens: 2048
      thinking_level: "low"
      omit_deprecated_sampling_params: true
    max_retries_per_sample: 3
    retry_temperature_step: 0.0
    request_timeout_sec: 180
    pricing_usd_per_1m_tokens:
      input: 0.75
      output: 3.75
  # Approved independent cross-judge: OpenAI GPT-5.4 Mini (`gpt-5.4-mini`), strictly non-Gemini/non-Gemma family; diagnostic only.
  # Pricing verified via https://platform.openai.com/docs/pricing & /models/gpt-5.4-mini.
  cross_judge_auditor:
    provider: "openai"
    model_family: "gpt"
    model_id: "gpt-5.4-mini"
    api_mode: "openai_compatible"
    api_base_env: "OPENAI_API_BASE"
    default_api_base: "https://api.openai.com/v1"
    api_key_env: "OPENAI_API_KEY"
    api_key_fallback_envs: ["JUDGE_API_KEY"]
    model_availability_verified: false
    pricing_verified: true
    decoding:
      temperature: 0.0
      top_p: 1.0
      max_tokens: 512
      use_max_completion_tokens: true
      reasoning_effort: "none"
      response_format:
        type: "json_object"
    request_timeout_sec: 90
    pricing_usd_per_1m_tokens:
      input: 0.75
      output: 4.50
  cross_judge_independence_policy:
    require_distinct_model_id: true
    require_distinct_model_family: true
    require_distinct_provider: true
    disallowed_same_vendor_families:
      - ["gemini", "gemma"]
      - ["gpt", "o1", "o3", "o4"]
    diagnostic_only_never_gold: true
  natural_qa_models:
    # Held-out test_natural respondents (3 distinct families per question; pending Phase 2 natural generation verification)
    - model_id: "PENDING_NATURAL_MODEL_1"
      provider: "google_gemini"
      model_family: "gemini"
      verified: false
      temperature: 0.7
      max_tokens: 512
    - model_id: "PENDING_NATURAL_MODEL_2"
      provider: "PENDING_NON_GEMINI_PROVIDER_A"
      model_family: "PENDING_NON_GEMINI_FAMILY_A"
      verified: false
      temperature: 0.7
      max_tokens: 512
    - model_id: "PENDING_NATURAL_MODEL_3"
      provider: "PENDING_NON_GEMINI_PROVIDER_B"
      model_family: "PENDING_NON_GEMINI_FAMILY_B"
      verified: false
      temperature: 0.7
      max_tokens: 512

prompts:
  version: "v1.0"
  strategy_a_sequential: "prompts/v1_0/strategy_a_sequential.md"
  strategy_b_joint: "prompts/v1_0/strategy_b_joint.md"
  strategy_c_span_editing: "prompts/v1_0/strategy_c_span_editing.md"
  cross_judge_auditor: "prompts/v1_0/cross_judge_auditor.md"
  natural_qa_generation: "prompts/v1_0/natural_qa_generation.md"
  zero_shot_detector: "prompts/v1_0/zero_shot_detector.md"

eligibility_constraints:
  # Prevent forcing unnatural multi-label cramming into tiny answers
  G0:
    min_answer_words: 3
    min_clauses: 1
  G1:
    min_answer_words: 6
    min_clauses: 1
  G2:
    min_answer_words: 18
    min_clauses: 2
  G3:
    min_answer_words: 40
    min_clauses: 3
  G4:
    min_answer_words: 60
    min_clauses: 4
  G5:
    min_answer_words: 80
    min_clauses: 5
    require_context: true

automated_validation:
  refusal_patterns:
    - "i'm sorry"
    - "i cannot"
    - "i can't"
    - "as an ai"
    - "unable to fulfill"
    - "cannot provide false"
    - "against my guidelines"
  min_normalized_edit_distance_for_perturbed: 0.05
  min_length_ratio: 0.60
  max_length_ratio: 2.20
  short_answer_word_threshold: 25
  short_answer_max_words_cap: 95
  enforce_zero_ci_when_no_context: true

pilot_e0:
  enabled_only_after_approval: true
  source_split_pool: "train"
  total_unique_source_questions: 100  # 80 paired perturbed + 20 clean controls (100% disjoint source_group_ids)
  total_paired_source_items: 80
  total_clean_controls: 20
  total_evaluation_items: 260   # Core paired pilot: 80 * 3 strategies (A-forward, B, C) + 20 unmodified Clean controls
  order_sensitivity_extra_outputs: 36  # Additive E0-Order comparative slots: 18 subset items * 2 extra orders (reverse, randomized)
  total_evaluation_items_including_order_addon: 296  # 260 core + 36 additive E0-Order outputs (reusing 18 of 80 base items; 0 extra source questions)
  max_pilot_budget_usd: 10.0
  enforce_strict_budget_stop: true
  domain_dataset_quotas_base_items:
    # (perturbed_paired_items, clean_control_items)
    medquad: { perturbed: 16, clean: 4 }
    pubmedqa: { perturbed: 16, clean: 4 }
    legal_qa_v1: { perturbed: 12, clean: 3 }
    cuad_qa: { perturbed: 16, clean: 4 }
    fiqa: { perturbed: 20, clean: 5 }
  combination_quotas_paired_base:
    # Option R1 context-allocation rebalance (preserves exact domain/dataset quotas, 60/40 context split, and G1..G5 tier totals):
    # Shifts 4 CI=1 slots -> CI=0 (00001:5->4/10000:5->6; 10001:3->2/11000:3->4; 01001:3->2/01010:3->4; 10101:2->1/11010:3->4)
    # Yielding 28 CI=1 + 4 reserved context-present CI=0 perturbed items (2 G1 + 2 G2) across the 32 with_context items.
    # G1 (25 items -> 75 generated across A,B,C)
    "10000": 6   # FI (Option R1: +1, 5->6)
    "01000": 5   # FF
    "00100": 5   # II
    "00010": 5   # LI
    "00001": 4   # CI (Option R1: -1, 5->4; context-present only)
    # G2 (30 items -> 90 generated across A,B,C)
    "11000": 4   # FI+FF (Option R1: +1, 3->4)
    "10010": 3   # FI+LI
    "01010": 4   # FF+LI (Option R1: +1, 3->4)
    "10100": 3   # FI+II
    "01100": 3   # FF+II
    "00110": 3   # II+LI
    "10001": 2   # FI+CI (Option R1: -1, 3->2)
    "01001": 2   # FF+CI (Option R1: -1, 3->2)
    "00011": 3   # LI+CI
    "00101": 3   # II+CI
    # G3 (18 items -> 54 generated across A,B,C)
    "11010": 4   # FI+FF+LI (Option R1: +1, 3->4)
    "11100": 2   # FI+FF+II
    "10110": 2   # FI+II+LI
    "01110": 1   # FF+II+LI
    "11001": 3   # FI+FF+CI
    "10011": 3   # FI+LI+CI
    "01011": 2   # FF+LI+CI
    "10101": 1   # FI+II+CI (Option R1: -1, 2->1)
    # G4 & G5 Stress (7 items -> 21 generated across A,B,C)
    "11110": 2   # FI+FF+II+LI
    "11011": 2   # FI+FF+LI+CI
    "11101": 1   # FI+FF+II+CI
    "11111": 2   # FI+FF+II+LI+CI
  context_non_ci_tier_quotas:
    # Reserve the 4 context-present CI=0 perturbed items strictly as 2 G1 + 2 G2 (1 pubmedqa + 1 cuad_qa per tier)
    G1: 2
    G2: 2
  order_sensitivity_subset:
    # Identified multi-label paired subset from the 80 items tested under forward, reverse, and randomized Strategy A step orders
    enabled: true
    subset_size: 18   # 10 G2 pairs + 8 G3 triples across domains and context regimes
    orders: ["forward", "reverse", "randomized"]
    orders_extra_calls: 36   # 18 * (reverse + randomized) additional Strategy A runs
  decision_gates:
    min_valid_rate_after_retries: 0.95
    min_g1_g2_target_recall: 0.85
    min_g3_target_recall: 0.78
    max_macro_spillover_rate: 0.12
    max_clean_false_positive_rate: 0.08
    stress_tier_retention_min_kappa: 0.65
    stress_tier_retention_min_coherence: 3.5
    stress_tier_retention_min_recall: 0.70

full_generation:
  enabled_only_after_pilot_signoff: true
  total_target_records: 12000
  split_ratios:
    train: 0.80
    val: 0.10
    test_synthetic: 0.10
  dataset_quotas_total:
    medquad: 2400      # 1920 train / 240 val / 240 test_synthetic (20.0%)
    pubmedqa: 2400     # 1920 train / 240 val / 240 test_synthetic (20.0%)
    legal_qa_v1: 1800  # 1440 train / 180 val / 180 test_synthetic (15.0% - local only)
    cuad_qa: 2400      # 1920 train / 240 val / 240 test_synthetic (20.0%)
    fiqa: 3000         # 2400 train / 300 val / 300 test_synthetic (25.0% - local only)
  combination_quotas:
    no_context:
      total: 7200
      "00000": 1296
      "10000": 600
      "01000": 600
      "00100": 500
      "00010": 460
      "11000": 564
      "10010": 460
      "01010": 380
      "10100": 420
      "01100": 420
      "00110": 240
      "11010": 420
      "11100": 320
      "10110": 180
      "01110": 160
      "11110": 180   # Conditional G4 stress
    with_context:
      total: 4800
      "00000": 864
      "10000": 200
      "01000": 200
      "00100": 160
      "00010": 160
      "00001": 720
      "11000": 120
      "10010": 84
      "01010": 72
      "10100": 60
      "01100": 60
      "10001": 360
      "01001": 360
      "00011": 240
      "00101": 240
      "11010": 120
      "11001": 220
      "10011": 160
      "01011": 120
      "10101": 100
      "11011": 60    # Conditional G4 stress
      "11101": 30    # Conditional G4 stress
      "10111": 30    # Conditional G4 stress
      "11111": 60    # Conditional G5 stress
  human_gold_subsets:
    test_synthetic_gold_target: 400
    test_natural_target: 360   # 120 questions x 3 natural LLM respondents (grouped by shared source_group_id) or 360 grouped items across test_natural_pool (medquad=72, pubmedqa=72, legal_qa_v1=54, cuad_qa=72, fiqa=90)
    natural_group_all_responses_by_question: true
    raters_per_synthetic_gold: 2
